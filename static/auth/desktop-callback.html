<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Returning to Catmos</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: #e0e0e0; }
  main { text-align: center; padding: 2rem; max-width: 28rem; }
</style>
</head>
<body>
<main>
  <h1 id="title">Returning to Catmos…</h1>
  <p id="detail">You can close this tab once Catmos shows you are signed in.</p>
</main>
<script>
// The desktop app listens on a loopback port and puts that port at the front
// of the OAuth `state` value as `<port>.<random>`. This page only forwards the
// authorization server's answer to that listener. The code it carries is
// useless without the PKCE verifier and DPoP key held by the desktop app.
(function () {
  var query = window.location.search;
  var state = new URLSearchParams(query).get('state') || '';
  var match = /^([1-9][0-9]{3,4})\.[A-Za-z0-9_.~-]+$/.exec(state);
  var port = match ? Number(match[1]) : 0;
  if (port < 1024 || port > 65535) {
    document.getElementById('title').textContent = 'Sign-in could not be completed';
    document.getElementById('detail').textContent = 'Return to Catmos and try signing in again.';
    return;
  }
  window.location.replace('http://127.0.0.1:' + port + '/callback' + query);
})();
</script>
</body>
</html>
