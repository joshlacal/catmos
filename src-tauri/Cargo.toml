[package]
name = "catmos"
version = "0.1.0"
edition = "2021"
description = "Catmos - Encrypted group chat on AT Protocol"

[lib]
name = "catmos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "=0.37.0", default-features = false }
base64 = "0.22"
async-trait = "0.1"
tracing = "0.1"
bytes = "1"

dirs = "6"
ciborium = "0.2"
catbird_mls = { path = "../../catbird-mls" }
catbird-atproto = { path = "../../catbird-atproto" }

urlencoding = "2.1.3"
httparse = "1"
getrandom = "0.2"
hex = "0.4"
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled-sqlcipher"] }

[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
