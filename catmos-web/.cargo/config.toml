# Cargo configuration for catmos-web WASM target.
#
# getrandom 0.3.x and 0.4.x (pulled in as transitive deps from catbird-mls via
# hpke-rs / rand 0.9+) require an explicit backend selection for
# wasm32-unknown-unknown. Setting the `getrandom_backend` cfg here enables the
# wasm-js backend (equivalent to the old `features = ["js"]` in getrandom 0.2).
#
# See: https://docs.rs/getrandom/latest/getrandom/#webassembly-support

[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
